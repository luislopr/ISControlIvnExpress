<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertar Proveedor</title>
</head>
<body>
    <h1>Insertar Proveedor</h1>
    <form id="proveedorForm">
        <label for="rif">RIF:</label>
        <input type="text" id="rif" name="rif" required><br>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br>

        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono"><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>

        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" name="direccion"><br>

        <label for="dias_credito">Días de Crédito:</label>
        <input type="number" id="dias_credito" name="dias_credito" value="0" required><br>

        <label for="dias_promedio_entrega">Días Promedio de Entrega:</label>
        <input type="number" id="dias_promedio_entrega" name="dias_promedio_entrega" value="1" step="0.1" required><br>

        <button type="submit">Insertar Proveedor</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
