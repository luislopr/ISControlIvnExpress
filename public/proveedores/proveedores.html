<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="container">
        <h1 id="title">Gestión de Proveedores</h1>
        <h2>Administra tus proveedores de manera eficiente</h2>
        <div class="buttons">
            <button class="btn" onclick="showModal('add')">Agregar Proveedor</button>
            <button class="btn" onclick="listProviders()">Listar Proveedores</button>
            <a href="../dashboard.html">
                <button class="btn">Volver al Dashboard</button>
            </a>
        </div>

        <div id="lista-proveedores-container" style="display: none;">
            <h3>Lista de Proveedores</h3>
            <ul id="lista-proveedores"></ul>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content" id="modal-content">
            <span class="close" onclick="hideModal()">&times;</span>
            <h3 id="modal-title">Agregar Proveedor</h3>
            <form id="modal-form" method="post" action="/api/proveedores">
                <label for="rif">RIF:</label>
                <input type="text" id="rif" name="rif" required>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
                <label for="telefono">Teléfono:</label>
                <input type="text" id="telefono" name="telefono">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <label for="direccion">Dirección:</label>
                <input type="text" id="direccion" name="direccion">
                <label for="dias_credito">Días de Crédito:</label>
                <input type="number" id="dias_credito" name="dias_credito" value="0" required>
                <label for="dias_promedio_entrega">Días Promedio de Entrega:</label>
                <input type="number" id="dias_promedio_entrega" name="dias_promedio_entrega" value="1" step="0.1" required>
                <button type="submit">Agregar Proveedor</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 InvenPizza. Todos los derechos reservados.</p>
        <p>Contacto: info@InvenPizza.com</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
