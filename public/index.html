<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Inventarios</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1 id="title">Inven Pizza</h1>
        <h2>Tu mejor amigo para gestionar inventario</h2>
        <div class="buttons">
            <button class="btn" onclick="showModal('register')">Registrate</button>
            <button class="btn" onclick="showModal('login')">Logearse</button>
        </div>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content" id="modal-content">
            <span class="close" onclick="hideModal()">&times;</span>
            <h3 id="modal-title"></h3>
            <form id="modal-form" method="post" action="">
                <div id="register-fields">
                    <label for="nombre_completo">Nombre Completo:</label>
                    <input type="text" id="nombre_completo" name="nombre_completo" required>
                    <label for="email">E-Mail:</label>
                    <input type="text" id="email" name="email" required>
                </div>

                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 InvenPizza. Todos los derechos reservados.</p>
        <p>Contacto: info@InvenPizza.com</p>
    </footer>
    <script src="scripts.js"></script>
</body>

</html>
